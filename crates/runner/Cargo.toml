[package]
name = "n64rusty-runner"
description = "Runs recompiled N64 code headless and replaces system routines"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
# The graphics crate needs a newer compiler than the rest of the workspace.
rust-version = "1.88"

[dependencies]
n64rusty-runtime.workspace = true
n64rusty-refcpu = { path = "../refcpu" }
n64rusty-rom = { path = "../rom" }
n64rusty-gfx = { path = "../gfx" }
n64rusty-audio = { path = "../audio", features = ["speaker"] }
n64rusty-host = { path = "../host" }
n64rusty-mod-api = { path = "../mod-api" }
libloading = "0.8"
winit = "0.30"

# The player's "pick your ROM" window.
[target.'cfg(windows)'.dependencies]
rfd = "0.15"
windows-sys = { version = "0.61", features = ["Win32_System_Console"] }
