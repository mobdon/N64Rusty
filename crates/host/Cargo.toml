[package]
name = "n64rusty-host"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[dependencies]
font8x8 = "0.3"
gilrs = "0.11"
serde = { version = "1", features = ["derive"] }
softbuffer = "0.4"
toml = "1"
winit = { version = "0.30", features = ["serde"] }

# The Android app's activity (see src/android.rs).
[target.'cfg(target_os = "android")'.dependencies]
winit = { version = "0.30", features = ["serde", "android-native-activity"] }
# The start screen draws through the GPU there: the game's window must not
# have been drawn into by the CPU.
n64rusty-gfx = { path = "../gfx" }

# The window's menu bar and its "open a ROM" file window.
[target.'cfg(windows)'.dependencies]
muda = { version = "0.17", default-features = false }
rfd = "0.15"
# Waiting for the program started again to show its window.
windows-sys = { version = "0.61", features = ["Win32_System_Threading"] }
