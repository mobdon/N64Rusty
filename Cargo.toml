[workspace]
resolver = "2"
members = ["crates/translator", "crates/runtime", "crates/cli"]

[workspace.package]
version = "0.0.0"
edition = "2021"
license = "MIT OR Apache-2.0"
repository = "https://github.com/mobdon/N64Rusty"
rust-version = "1.75"

[workspace.dependencies]
n64rusty-translator = { path = "crates/translator" }
n64rusty-runtime = { path = "crates/runtime" }
