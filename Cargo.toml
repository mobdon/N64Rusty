[workspace]
resolver = "2"
members = ["crates/translator", "crates/runtime", "crates/cli", "crates/refcpu", "crates/conformance", "crates/rom", "crates/host", "crates/gfx", "crates/runner", "crates/audio", "crates/mod-api", "crates/android"]

exclude = ["vendor"]

# winit with an Android game controller's right stick, triggers and D-pad
# passed on (vendor/winit: one change, marked N64RUSTY).
[patch.crates-io]
winit = { path = "vendor/winit" }

[workspace.package]
version = "0.0.0"
edition = "2021"
license = "MIT OR Apache-2.0"
repository = "https://github.com/mobdon/N64Rusty"
rust-version = "1.77"

[workspace.dependencies]
n64rusty-translator = { path = "crates/translator" }
n64rusty-runtime = { path = "crates/runtime" }

# The conformance tests run hundreds of thousands of guest instructions;
# optimise the crates they exercise even in debug builds.
[profile.dev.package.n64rusty-conformance]
opt-level = 2
[profile.dev.package.n64rusty-refcpu]
opt-level = 2
[profile.dev.package.n64rusty-runtime]
opt-level = 2
