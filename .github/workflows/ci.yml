name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  # The renderer tests draw on a GPU or a software adapter (lavapipe on
  # Linux, WARP on Windows, Metal on macOS); fail rather than skip.
  N64RUSTY_REQUIRE_GPU: "1"

jobs:
  test:
    name: Build and test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: Install Linux libraries
        if: runner.os == 'Linux'
        # Gamepad support (gilrs) links against libudev; speaker output (cpal)
        # against ALSA; the renderer tests draw on lavapipe, the software
        # Vulkan driver.
        run: sudo apt-get update && sudo apt-get install -y libudev-dev libasound2-dev mesa-vulkan-drivers
      - name: Format
        run: cargo fmt --all -- --check
      - name: Check PowerShell scripts parse
        if: runner.os == 'Windows'
        shell: powershell
        run: |
          foreach ($f in Get-ChildItem scripts\*.ps1) {
            $errors = $null
            [void][System.Management.Automation.Language.Parser]::ParseFile($f.FullName, [ref]$null, [ref]$errors)
            if ($errors) { $errors; exit 1 }
          }
      - name: Clippy
        run: cargo clippy --workspace --all-targets --all-features -- -D warnings
      - name: Build
        run: cargo build --workspace --all-targets --all-features
      - name: Test
        run: cargo test --workspace --all-features
