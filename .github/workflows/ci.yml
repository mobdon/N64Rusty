name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  # The renderer tests draw on a GPU or a software adapter (lavapipe on
  # Linux, WARP on Windows, Metal on macOS); fail rather than skip.
  N64RUSTY_REQUIRE_GPU: "1"

jobs:
  test:
    name: Build and test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: Install Linux libraries
        if: runner.os == 'Linux'
        # Gamepad support (gilrs) links against libudev; speaker output (cpal)
        # against ALSA; the renderer tests draw on lavapipe, the software
        # Vulkan driver.
        run: sudo apt-get update && sudo apt-get install -y libudev-dev libasound2-dev mesa-vulkan-drivers
      - name: Format
        run: cargo fmt --all -- --check
      - name: Check PowerShell scripts parse
        if: runner.os == 'Windows'
        shell: powershell
        run: |
          foreach ($f in Get-ChildItem scripts\*.ps1) {
            $errors = $null
            [void][System.Management.Automation.Language.Parser]::ParseFile($f.FullName, [ref]$null, [ref]$errors)
            if ($errors) { $errors; exit 1 }
          }
      - name: Clippy
        run: cargo clippy --workspace --all-targets --all-features -- -D warnings
      - name: Build
        run: cargo build --workspace --all-targets --all-features
      - name: Test
        run: cargo test --workspace --all-features
      - name: Build the player
        if: runner.os == 'Windows' && github.ref == 'refs/heads/main'
        run: cargo build --release -p n64rusty-runner --bin n64rusty-play
      - name: Keep the player
        if: runner.os == 'Windows' && github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@v4
        with:
          name: n64rusty-play-windows
          path: target/release/n64rusty-play.exe

  android:
    # The Android app and the host's Android code (crates/android,
    # crates/host/src/android.rs and the android branches of the window and
    # start screen) only compile for Android, so the jobs above never see
    # them. A check, not a build: no APK, no signing key.
    name: Check the Android app
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android
      - uses: Swatinem/rust-cache@v2
      - name: Use the NDK's compilers
        # Sound on Android (cpal through Oboe) builds C++ with the NDK, which
        # the runner image carries.
        run: |
          bin="$ANDROID_NDK_LATEST_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin"
          echo "CC_aarch64_linux_android=$bin/aarch64-linux-android26-clang" >> "$GITHUB_ENV"
          echo "CXX_aarch64_linux_android=$bin/aarch64-linux-android26-clang++" >> "$GITHUB_ENV"
          echo "AR_aarch64_linux_android=$bin/llvm-ar" >> "$GITHUB_ENV"
      - name: Check
        run: cargo check --target aarch64-linux-android -p n64rusty-host -p n64rusty-android
